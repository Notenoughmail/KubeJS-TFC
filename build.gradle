plugins {
    id 'com.matthewprenger.cursegradle' version '1.4.0'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.107'
    id "dev.vfyjxf.modaccessor" version "1.2.1"
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = "${minecraft_version}-${mod_version}"
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

// Include resources generated by data generators.
sourceSets {
    main {
        resources {
            srcDir 'src/generated/resources'
        }
    }
    create("data") {
        compileClasspath += main.compileClasspath + main.output
        runtimeClasspath += main.runtimeClasspath + main.output
    }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    validateAccessTransformers = false

    accessTransformers.from('src/main/resources/META-INF/accesstransformer.cfg', 'src/main/resources/META-INF/modaccesstransformer.cfg')

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.data)
        }
    }

    runs {
        configureEach {
            gameDirectory = project.file('run')

            jvmArguments = ["-XX:+IgnoreUnrecognizedVMOptions", "-XX:+AllowEnhancedClassRedefinition"]

            systemProperty('terminal.jline', 'true')

            programArgument('-mixin.config=kubejs_tfc.mixins.json')
        }

        client {
            client()
        }

        server {
            server()

            programArgument('-nogui')
        }

        data {
            data()

            sourceSet = sourceSets.data

            programArguments.addAll(
                    '--mod', project.mod_id,
                    '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath(),
                    '--existing-mod', 'tfc'
            )
        }
    }

    interfaceInjectionData.from("injections.json", "modinjections.json")
}

repositories {
    mavenCentral()
    maven {
        name = "Curse Maven"
        url = "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        // Lat (KubeJS and Rhino)
        name = "latvian.dev"
        url = "https://maven.latvian.dev/releases"
        content {
            includeGroup "dev.latvian.mods"
            includeGroup "dev.latvian.apps"
        }
    }
    maven {
        url = 'https://jitpack.io'
        content {
            includeGroup "com.github.rtyley"
        }
    }
    maven {
        url = "https://maven.blamejared.com/"
        content {
            includeGroup "mezz.jei"
        }
    }
    flatDir {
        dir 'libs'
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
    implementation.extendsFrom tfcImplementation
}

modAccessor {
    createTransformConfiguration(configurations.implementation)
    createTransformConfiguration(configurations.tfcImplementation).canBeResolved(true)
    accessTransformerFiles = project.files('src/main/resources/META-INF/modaccesstransformer.cfg')
    interfaceInjectionFiles = project.files('modinjections.json')
}

dependencies {
    accessTfcImplementation "curse.maven:terrafirmacraft-302973:${tfc_file}"
        runtimeOnly "curse.maven:cyanide-541676:${cyanide_file}"
    implementation "curse.maven:precision-prospecting-700638:${precpros_file}"
    implementation "curse.maven:arborfirmacraft-877545:${arbor_file}"

    runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    implementation "curse.maven:patchouli-306770:${patchi_file}"

    runtimeOnly "curse.maven:jade-324717:${jade_file}"

    implementation "dev.latvian.mods:kubejs-neoforge:${kubejs_version}"
    implementation "dev.latvian.mods:rhino:${rhino_version}"

    implementation "curse.maven:entityjs-967617:${entityjs_file}"
    implementation "curse.maven:geckolib-388172:${geckolib_file}"

    interfaceInjectionData(
            "dev.latvian.mods:kubejs-neoforge:${kubejs_version}",
            project.files('modinjections.json')
    )
    accessTransformers(
            "dev.latvian.mods:kubejs-neoforge:${kubejs_version}",
            accessors("accessTfcImplementation")
    )
}

// There's probably a better way of doing this, and it wouldn't surprise me if this breaks something as some point, but it works
ConfigurableFileCollection accessors(String conf) {
    return files(zipTree(project.getConfigurations().findByName(conf).singleFile).matching {
        include "**/*.cfg"
    }.files)
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            tfc_version_range      : tfc_version_range,
            kube_version_range     : kube_version_range
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata

neoForge.ideSyncTask generateModMetadata

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'MixinConfigs'            : "kubejs_tfc.mixins.json"
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters'
}

idea {
    module {
        downloadJavadoc = true
        downloadSources = true
    }
}
