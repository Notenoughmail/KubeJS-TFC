plugins {
    id 'com.matthewprenger.cursegradle' version '1.4.0'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.107'
    id "dev.vfyjxf.modaccessor" version "1.2.1"
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = "${minecraft_version}-${mod_version}"
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    validateAccessTransformers = false

    accessTransformers.from 'src/main/resources/META-INF/accesstransformer.cfg'

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    runs {
        configureEach {
            gameDirectory = project.file('run')

            jvmArguments = ["-XX:+IgnoreUnrecognizedVMOptions", "-XX:+AllowEnhancedClassRedefinition"]

            systemProperty('terminal.jline', 'true')

            programArgument('-mixin.config=kubejs_tfc.mixins.json')
        }

        client {
            client()
        }

        server {
            server()

            programArgument('-nogui')
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()
    maven {
        name = "Curse Maven"
        url = "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        // Lat (KubeJS and Rhino)
        name = "latvian.dev"
        url = "https://maven.latvian.dev/releases"
        content {
            includeGroup "dev.latvian.mods"
            includeGroup "dev.latvian.apps"
        }
    }
    maven {
        url = 'https://jitpack.io'
        content {
            includeGroup "com.github.rtyley"
        }
    }
    flatDir {
        dir 'libs'
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

modAccessor {
    createTransformConfiguration(configurations.compileOnly)
    accessTransformerFiles = project.files('src/main/resources/META-INF/accesstransformer.cfg')
    interfaceInjectionFiles = project.files('injections.json')
}

dependencies {
    accessCompileOnly("curse.maven:terrafirmacraft-302973:${tfc_file}")
    implementation "curse.maven:terrafirmacraft-302973:${tfc_file}"
        runtimeOnly "curse.maven:cyanide-541676:${cyanide_file}"
    // implementation "curse.maven:firmalife-453394:${firmalife_identifier}"
    // modImplementation "curse.maven:rosia-856122:${rosia_identifier}"
    // compileOnly "curse.maven:arborfirmacraft-877545:${arbor_identifier}"
    implementation "curse.maven:precision-prospecting-700638:${precpros_file}"
    // implementation "curse.maven:beneath-1113980:${beneath_identifier}"
    // implementation "curse.maven:tfc-artisanal-1059361:${artisanal_identifier}"

    // runtimeOnly "mezz.jei:jei-${minecraft_version}-forge:${jei_version}"

    implementation "curse.maven:patchouli-306770:${patchi_file}"

    runtimeOnly "curse.maven:jade-324717:${jade_file}"

    implementation "dev.latvian.mods:kubejs-neoforge:${kubejs_version}"
    implementation "dev.latvian.mods:rhino:${rhino_version}"

    implementation "curse.maven:entityjs-967617:${entityjs_file}"
    implementation "curse.maven:geckolib-388172:${geckolib_file}"

    // This *must* be before mixin's annotation processor (for versions lower than 0.2.0-rc.3, which we are due to Kube and will not jij an upgraded version out of principle) as refmaps will be incomplete otherwise
    // compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.2.0-rc.2"))
    // annotationProcessor("org.spongepowered:mixin:${mixin_version}:processor")
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            tfc_version_range      : tfc_version_range,
            kube_version_range     : kube_version_range
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata

neoForge.ideSyncTask generateModMetadata

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'MixinConfigs'            : "kubejs_tfc.mixins.json"
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters'
}

idea {
    module {
        downloadJavadoc = true
        downloadSources = true
    }
}
